{{- if .Values.quota.enabled }}
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "ekc.fullname" . }}-defaults
  labels: {{- include "ekc.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default: {memory: 512Mi, ephemeral-storage: 256Mi}
      defaultRequest: {cpu: 100m, memory: 128Mi, ephemeral-storage: 32Mi}
      max: {cpu: "4", memory: 4Gi, ephemeral-storage: 1Gi}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "ekc.fullname" . }}-quota
  labels: {{- include "ekc.labels" . | nindent 4 }}
spec:
  hard:
    pods: {{ .Values.quota.pods | quote }}
    requests.cpu: {{ .Values.quota.requestsCpu | quote }}
    requests.memory: {{ .Values.quota.requestsMemory }}
    limits.memory: {{ .Values.quota.limitsMemory }}
    persistentvolumeclaims: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"
{{- end }}
