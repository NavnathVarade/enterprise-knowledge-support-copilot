{{- $n := printf "%s-api" (include "ekc.fullname" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $n }}
  labels:
    {{- include "ekc.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $n }}
    app.kubernetes.io/component: api
spec:
  # replicas unset on purpose: the HPA owns the count.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $n }}}
  template:
    metadata:
      labels:
        {{- include "ekc.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ $n }}
        app.kubernetes.io/component: api
    spec:
      {{- include "ekc.podSecurity" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      {{- include "ekc.antiAffinity" (dict "name" $n) | nindent 6 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: {{ $n }}}
      containers:
        - name: api
          image: {{ include "ekc.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8000}
          {{- include "ekc.envFrom" . | nindent 10 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          {{- include "ekc.containerSecurity" . | nindent 10 }}
          startupProbe:
            httpGet: {path: /api/v1/health/live, port: http}
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /api/v1/health/live, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /api/v1/health/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: {command: ["python", "-c", "import time; time.sleep(8)"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: kafka-ca, mountPath: /etc/ekc/kafka-ca, readOnly: true}
      volumes: {{- include "ekc.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $n }}
  labels:
    {{- include "ekc.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $n }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: {{ $n }}}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $n }}
  labels: {{- include "ekc.labels" . | nindent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ $n }}}
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilization }}}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $n }}
  labels: {{- include "ekc.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $n }}}
