# Shared proxy settings (included by the locations in nginx.conf).
proxy_pass http://ekc_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# APPEND the address nginx actually saw to whatever the client sent. The API takes the n-th
# entry from the RIGHT (HARDENING_TRUSTED_PROXY_HOPS=1 -> the entry nginx added), so a client
# cannot choose its own address by sending a forged X-Forwarded-For.
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $ekc_request_id;
proxy_connect_timeout 3s;
proxy_send_timeout    30s;
# Longest legitimate request is a generated answer (LLM timeout 30 s, with retry/fallback).
proxy_read_timeout    90s;
# Never replay a request on another upstream: POSTs here are not idempotent.
proxy_next_upstream off;
proxy_request_buffering on;
