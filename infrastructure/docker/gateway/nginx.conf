# Edge gateway for the Compose reference environment (nginx-unprivileged, listens on 8080).
#
# What it is for: the single published entry point. It terminates client connections, sets the
# forwarded-for chain the API trusts (HARDENING_TRUSTED_PROXY_HOPS=1), keeps /metrics off the
# public side, and applies coarse limits as defence in depth. The API still enforces everything
# itself (auth, body limits, throttling); nothing here replaces that.
#
# TLS is NOT terminated here: in production the TLS-terminating load balancer / ingress
# (infrastructure/kubernetes/base/ingress.yaml) sits in front. If you run this stack on an
# untrusted network, put certificates in front of it; do not publish port 8080 to the internet.
#
# Runs as non-root: every writable path is under /tmp (the container root filesystem is read-only).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Keep a caller-supplied correlation id (the API sanitises it), otherwise mint one here.
    map $http_x_request_id $ekc_request_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # $uri (not $request_uri): query strings can carry secrets and are not logged.
    log_format ekc_json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$ekc_request_id",'
        '"method":"$request_method","uri":"$uri","status":$status,"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout ekc_json;

    # Slow-client protection.
    client_header_timeout 10s;
    client_body_timeout   15s;
    send_timeout          30s;
    keepalive_timeout     30s;
    # Must be >= the API upload cap (25 MiB) + multipart overhead, so oversized uploads reach the
    # API and get its JSON 413 instead of nginx's HTML one. Everything else is capped by the API
    # at 1 MiB (HARDENING_MAX_REQUEST_BODY_BYTES).
    client_max_body_size  26m;

    # Coarse per-client-address limits (the API has its own, finer, login throttle). Shared NAT
    # means these must stay generous; tune from real traffic (NOT YET MEASURED).
    limit_req_zone  $binary_remote_addr zone=login_zone:10m rate=30r/m;
    limit_req_zone  $binary_remote_addr zone=api_zone:10m   rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;
    limit_req_status  429;
    limit_conn_status 429;

    upstream ekc_api {
        # Compose service DNS name, never localhost. Resolved at start-up, so this container
        # depends_on the api being healthy.
        server api:8000 max_fails=0;
        keepalive 32;
    }

    upstream ekc_web {
        # Static single-page app (apps/web). Same origin as the API: no CORS anywhere.
        server web:8080 max_fails=0;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        # Gateway's own liveness (does not touch the API).
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Metrics are scraped by Prometheus on the internal network, never through the gateway.
        location /metrics {
            return 404;
        }

        location = /api/v1/auth/login {
            limit_req zone=login_zone burst=20 nodelay;
            include /etc/nginx/ekc_proxy.conf;
        }

        # Everything under /api goes to the API (its own routes, health and error contract).
        location /api/ {
            limit_req  zone=api_zone burst=100 nodelay;
            limit_conn conn_zone 50;
            include /etc/nginx/ekc_proxy.conf;
        }

        # Everything else is the web app (shell, hashed assets, client-side routes). Its own nginx
        # sets the CSP and cache headers, which pass through unchanged.
        location / {
            limit_req  zone=api_zone burst=100 nodelay;
            limit_conn conn_zone 50;
            proxy_pass http://ekc_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $ekc_request_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout    15s;
            proxy_next_upstream off;
        }
    }
}
