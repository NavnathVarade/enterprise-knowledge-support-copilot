# Static single-page app (apps/web). Serves only files baked into its image: no secrets, no
# ConfigMap, no data access, no outbound traffic, no Kubernetes API token.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ekc-web
  labels: {app.kubernetes.io/name: ekc-web, app.kubernetes.io/component: web}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: ekc-web}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ekc-web, app.kubernetes.io/component: web}
    spec:
      serviceAccountName: ekc
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: ekc-web}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: ekc-web}
      containers:
        - name: web
          image: ekc-web
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 50m, memory: 32Mi, ephemeral-storage: 16Mi}
            limits: {memory: 128Mi, ephemeral-storage: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness serves the real app shell (proves the static files are present); liveness
          # only proves nginx answers.
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ekc-web
  labels: {app.kubernetes.io/name: ekc-web}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: ekc-web}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ekc-web
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ekc-web}
