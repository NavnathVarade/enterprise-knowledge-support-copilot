apiVersion: apps/v1
kind: Deployment
metadata:
  name: ekc-api
  labels: {app.kubernetes.io/name: ekc-api, app.kubernetes.io/component: api}
spec:
  # replicas intentionally unset: the HPA (minReplicas) owns the count, so a re-apply never
  # fights the autoscaler.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: ekc-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ekc-api, app.kubernetes.io/component: api}
    spec:
      serviceAccountName: ekc
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: ekc-api}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: ekc-api}
      containers:
        - name: api
          image: ekc
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: ekc-config}
            - secretRef: {name: ekc-secrets}
          resources:
            requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 64Mi}
            limits: {memory: 1Gi, ephemeral-storage: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /api/v1/health/live, port: http}
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /api/v1/health/live, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /api/v1/health/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: {command: ["python", "-c", "import time; time.sleep(8)"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: kafka-ca, mountPath: /etc/ekc/kafka-ca, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
        - name: kafka-ca
          secret: {secretName: ekc-kafka-ca, optional: false}
---
apiVersion: v1
kind: Service
metadata:
  name: ekc-api
  labels: {app.kubernetes.io/name: ekc-api}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: ekc-api}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ekc-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: ekc-api}
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ekc-api
spec:
  minAvailable: 2
  selector:
    matchLabels: {app.kubernetes.io/name: ekc-api}
