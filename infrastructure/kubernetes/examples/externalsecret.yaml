# EXAMPLE (not in the kustomization): populate `ekc-secrets` from a secret manager via
# External Secrets Operator. Remote key names are placeholders.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ekc-secrets
  namespace: ekc
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: REPLACE_ME}
  target: {name: ekc-secrets, creationPolicy: Owner}
  data:
    # The stored value must carry ?ssl=require (or verify-full): the app refuses plaintext in production.
    - {secretKey: DATABASE_URL, remoteRef: {key: ekc/prod/database-url}}
    - {secretKey: LLM_API_KEY, remoteRef: {key: ekc/prod/llm-api-key}}
    - {secretKey: EMBEDDING_API_KEY, remoteRef: {key: ekc/prod/embedding-api-key}}
    - {secretKey: SECURITY_JWT_PUBLIC_KEY, remoteRef: {key: ekc/prod/jwt-public-key}}
    - {secretKey: SECURITY_JWT_PRIVATE_KEY, remoteRef: {key: ekc/prod/jwt-private-key}}
    - {secretKey: KAFKA_SASL_USERNAME, remoteRef: {key: ekc/prod/kafka-username}}
    - {secretKey: KAFKA_SASL_PASSWORD, remoteRef: {key: ekc/prod/kafka-password}}
    - {secretKey: OTEL_METRICS_BEARER_TOKEN, remoteRef: {key: ekc/prod/metrics-token}}
    - {secretKey: OBJECT_STORE_BUCKET, remoteRef: {key: ekc/prod/object-store-bucket}}
# Also required out-of-band: Secret `ekc-kafka-ca` (key ca.crt) and Secret
# `ekc-metrics-token` (key metrics-token, same value as OTEL_METRICS_BEARER_TOKEN).
