# Prometheus alerting rules for Enterprise Knowledge Copilot.
# THRESHOLDS ARE UNTUNED STARTING POINTS: no production traffic exists to calibrate them
# (NOT YET MEASURED). Tune after a week of real data. Validated structurally and for
# metric/label existence by tests/unit/test_monitoring_assets.py and checked with `promtool check
# rules` (2.55.1, 13 rules, Phase 35). Thresholds have never fired against real traffic.
groups:
  - name: ekc-api
    rules:
      - alert: EkcApiHighErrorRate
        expr: |
          sum(rate(ekc_http_requests_total{status_class="5xx"}[5m]))
            / sum(rate(ekc_http_requests_total[5m])) > 0.05
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "More than 5% of API requests are failing with 5xx."
          runbook: docs/operations/PHASE_29_OBSERVABILITY.md#ekcapihigherrorrate
      - alert: EkcApiLatencyP95High
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(ekc_http_request_duration_seconds_bucket{route!="/api/v1/query"}[5m]))) > 2
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Non-query API p95 latency above 2s."
          runbook: docs/operations/PHASE_29_OBSERVABILITY.md#ekcapilatencyp95high
  - name: ekc-query
    rules:
      - alert: EkcQueryLatencyP95High
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(ekc_query_duration_seconds_bucket[10m]))) > 20
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "Query p95 latency above 20s (dominated by LLM latency)."
          runbook: docs/operations/PHASE_29_OBSERVABILITY.md#ekcquerylatencyp95high
      - alert: EkcAbstentionRateHigh
        expr: |
          sum(rate(ekc_answer_abstentions_total[1h])) / sum(rate(ekc_query_requests_total[1h])) > 0.5
        for: 1h
        labels: {severity: ticket}
        annotations:
          summary: "Over half of queries end in abstention: retrieval or ingestion may be degraded."
          runbook: docs/operations/PHASE_29_OBSERVABILITY.md#ekcabstentionratehigh
      - alert: EkcLlmFailureRatioHigh
        expr: |
          sum(rate(ekc_llm_requests_total{outcome=~"unavailable|timeout|invalid_response|error"}[10m]))
            / sum(rate(ekc_llm_requests_total[10m])) > 0.1
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "More than 10% of LLM calls are failing."
          runbook: docs/operations/PHASE_29_OBSERVABILITY.md#ekcllmfailureratiohigh
  - name: ekc-security
    rules:
      - alert: EkcOutputPolicyViolation
        expr: increase(ekc_output_policy_violations_total[1h]) > 0
        labels: {severity: ticket}
        annotations:
          summary: "A model output was blocked by output policy (possible prompt leak / exfiltration attempt)."
          runbook: docs/operations/PHASE_29_OBSERVABILITY.md#ekcoutputpolicyviolation
      - alert: EkcInjectionQuarantineSpike
        expr: increase(ekc_injection_chunks_quarantined_total[1h]) > 20
        labels: {severity: ticket}
        annotations:
          summary: "Unusual number of chunks quarantined as likely prompt injection."
          runbook: docs/operations/PHASE_29_OBSERVABILITY.md#ekcinjectionquarantinespike
      - alert: EkcAuditWriteFailures
        expr: increase(ekc_audit_write_failures_total[10m]) > 0
        labels: {severity: page}
        annotations:
          summary: "Audit events could not be written; the audit trail has gaps."
          runbook: docs/operations/PHASE_29_OBSERVABILITY.md#ekcauditwritefailures
  - name: ekc-pipeline
    rules:
      - alert: EkcKafkaConsumerLagHigh
        expr: max by (topic) (ekc_kafka_consumer_lag_messages) > 1000
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Consumer is more than 1000 messages behind."
          runbook: docs/operations/PHASE_29_OBSERVABILITY.md#ekckafkaconsumerlaghigh
      - alert: EkcDeadLetteredMessages
        expr: increase(ekc_kafka_messages_total{outcome="dead_lettered"}[15m]) > 0
        labels: {severity: ticket}
        annotations:
          summary: "Messages are being dead-lettered."
          runbook: docs/operations/PHASE_29_OBSERVABILITY.md#ekcdeadletteredmessages
      - alert: EkcOutboxBacklogAging
        expr: ekc_outbox_oldest_unpublished_age_seconds > 300
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Outbox rows have waited over 5 minutes: the relay is down or Kafka is unreachable."
          runbook: docs/operations/PHASE_29_OBSERVABILITY.md#ekcoutboxbacklogaging
      - alert: EkcOutboxPublishFailures
        expr: increase(ekc_outbox_relay_events_total{result="failed"}[10m]) > 0
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Outbox relay keeps failing to publish."
          runbook: docs/operations/PHASE_29_OBSERVABILITY.md#ekcoutboxpublishfailures
      - alert: EkcIngestionPermanentFailures
        expr: increase(ekc_ingestion_documents_total{outcome="failed_permanent"}[1h]) > 5
        labels: {severity: ticket}
        annotations:
          summary: "Several documents failed ingestion permanently in the last hour."
          runbook: docs/operations/PHASE_29_OBSERVABILITY.md#ekcingestionpermanentfailures
