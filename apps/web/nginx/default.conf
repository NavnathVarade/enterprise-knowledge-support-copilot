# Static server for the single-page app (nginx-unprivileged, port 8080, read-only root
# filesystem: temp paths live under /tmp, set by the base image's nginx.conf).
#
# Same-origin by design: the edge (Compose gateway / Kubernetes ingress) routes /api to the API
# and everything else here, so the API needs no CORS and browsers never send credentials
# cross-site. TLS and HSTS are applied by the edge, not here.

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Probe endpoint (no CSP needed: plain text, not rendered).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # These belong to the API. If one ever reaches this container the routing is wrong:
    # fail loudly with 404 instead of answering with the SPA shell (which would look like 200).
    location ~ ^/(api|metrics)(/|$) {
        include /etc/nginx/ekc_security_headers.conf;
        return 404;
    }

    # Content-hashed build output: safe to cache forever.
    location /assets/ {
        include /etc/nginx/ekc_security_headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Never serve dotfiles or source maps.
    location ~ /\.|\.map$ {
        return 404;
    }

    # The app shell must always revalidate so a deploy is picked up immediately.
    location / {
        include /etc/nginx/ekc_security_headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
