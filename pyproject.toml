[project]
name = "enterprise-knowledge-copilot"
version = "0.1.0"
description = "Enterprise AI Knowledge & Support Copilot — permission-aware, multi-tenant RAG platform."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.32",
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.1",
    "pgvector>=0.3.2",
    "redis>=5.0.8",
    "confluent-kafka>=2.5.0",
    "httpx>=0.27.0",
    "PyJWT[crypto]>=2.9.0",
    "bcrypt>=4.0.1",
    "orjson>=3.10.7",
    "structlog>=24.4.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "prometheus-client>=0.20.0",
    "tenacity>=9.0.0",
    "rank-bm25>=0.2.2",
    "pypdf>=6.21.2",
    "python-docx>=1.1.2",
    "boto3>=1.34.0",
]

[dependency-groups]
# Installed by `uv sync` by default (see [tool.uv]); production images use `--no-dev`.
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.111.0",
    "ruff>=0.6.4",
    "mypy>=1.11.2",
    "types-redis",
    "aiosqlite>=0.20.0",
    "fakeredis>=2.23.5",
    "faker>=28.4.1",
    "reportlab>=4.2.2",
    "moto[s3]>=5.0.0",
    "playwright>=1.48.0",
    "pyyaml>=6.0",       # manifest/workflow/Helm policy tests, readiness and docs scripts
    "jsonschema>=4.0",   # Helm values schema test
]

[tool.uv]
default-groups = ["dev"]
# Resolution must succeed for the platforms the container image targets (Linux amd64 and arm64),
# so a dependency without wheels for either is caught at `uv lock`, not at image build time.
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'linux' and platform_machine == 'aarch64'"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "apps*", "rag*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps", "packages", "rag", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ASYNC"]
# E501: line length handled by ruff format, not worth a separate lint failure.
# B008: flake8-bugbear flags `Depends(...)` in a function's default arguments as a
# generic "don't call functions in defaults" bug -- but FastAPI's dependency-injection
# system *requires* exactly this pattern (`param: X = Depends(get_x)`). This is a
# standard, documented exception when using FastAPI, not a relaxation of the rule for
# code that doesn't need it.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["migrations/"]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "boto3", "boto3.*", "botocore", "botocore.*", "moto", "moto.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# `uv run pytest` (unlike `python -m pytest`) does not put the repo root on sys.path, and tests import
# top-level packages such as `scripts` and `tests`.
pythonpath = ["."]
markers = [
    "unit: fast, no external dependencies",
    "integration: requires database/redis",
    "security: authorization and leakage tests",
    "contract: schema/event contract tests",
    "e2e: browser end-to-end tests (real Chromium + nginx + API); skipped when unavailable",
]

[tool.bandit]
# Tests legitimately use assert and fixed credentials. Production findings are fixed or carry
# an inline `# nosec Bxxx -- reason`; there are no blanket skips.
exclude_dirs = ["tests", "build", ".venv"]
